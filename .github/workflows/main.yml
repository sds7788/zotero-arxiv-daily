name: Send emails daily
on:
  workflow_dispatch:
    inputs:
      send_email:
        description: Send a real email (leave false for validation)
        type: boolean
        default: false
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: read

concurrency:
  group: daily-recommendations
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'workflow_dispatch' && github.repository || vars.REPOSITORY }}
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.5.4'

      - name: Install locked dependencies
        timeout-minutes: 30
        run: uv sync --locked

      - name: Run script
        env:
          SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email }}
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ZOTERO_IGNORE: ${{ vars.ZOTERO_IGNORE }}
          SEND_EMPTY: ${{ vars.SEND_EMPTY }}
          ARXIV_QUERY: ${{ secrets.ARXIV_QUERY }}
          SMTP_SERVER: ${{ (github.event_name == 'schedule' || inputs.send_email) && secrets.SMTP_SERVER || '' }}
          SMTP_PORT: ${{ (github.event_name == 'schedule' || inputs.send_email) && secrets.SMTP_PORT || '' }}
          SENDER: ${{ (github.event_name == 'schedule' || inputs.send_email) && secrets.SENDER || '' }}
          RECEIVER: ${{ (github.event_name == 'schedule' || inputs.send_email) && secrets.RECEIVER || '' }}
          SENDER_PASSWORD: ${{ (github.event_name == 'schedule' || inputs.send_email) && secrets.SENDER_PASSWORD || '' }}
          MAX_PAPER_NUM: ${{ secrets.MAX_PAPER_NUM }}
          USE_LLM_API: ${{ secrets.USE_LLM_API }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          LANGUAGE: ${{ vars.LANGUAGE }}
        run: |
          if [ "$SEND_EMAIL" = "true" ]; then
            uv run --locked main.py
          else
            uv run --locked main.py --dry-run
          fi
